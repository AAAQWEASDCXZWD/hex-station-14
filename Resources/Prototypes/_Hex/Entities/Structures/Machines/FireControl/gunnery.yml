# Gunnery control servers and consoles.
#
# The server claims one grid and registers every anchored FireControllable weapon on it.
# Consoles on the same grid link to that server and can order the registered weapons to fire.

- type: entity
  id: GunneryServerBase
  abstract: true
  parent: BaseMachinePowered
  name: gunnery control server
  description: Manages the remote operation of ship and station weapons.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/telecomms.rsi
    layers:
    - state: telecom-on
    - state: telecom-stripe
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ExaminableBattery
  - type: BatterySelfRecharger
  - type: StaticPrice
    price: 200

- type: entity
  id: GunneryServerMedium
  parent: GunneryServerBase
  name: medium-power gunnery control server
  components:
  - type: Machine
    board: MachineGCSMediumCircuitboard
  - type: FireControlServer
    processingPower: 42
  - type: Battery
    maxCharge: 250
    startingCharge: 250
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: ApcPowerReceiverBattery
    idleLoad: 10
    batteryRechargeRate: 600
    batteryRechargeEfficiency: 0.95

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerGunneryConsole
  name: gunnery control console
  description: Interfaces with a gunnery control server to operate ship and station weapons.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Hex/Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer_not_rot
    - map: [ "computerLayerKeyboard" ]
      state: gunnery_keyboard
    - map: [ "computerLayerScreen" ]
      state: gunnery_screen
    - map: [ "computerLayerKeys" ]
      state: gunnery_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: FireControlConsole
  # Small integrated fire-control server so a console + cannon works out of the box.
  # Dedicated GunneryServer machines take over the grid when present.
  - type: FireControlServer
    processingPower: 24
  - type: RadarConsole
    maxRange: 512
  - type: ActivatableUI
    key: enum.FireControlConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FireControlConsoleUiKey.Key:
        type: FireControlConsoleBoundUserInterface
        requireInputValidation: false
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: GunneryControlComputerCircuitboard
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#fc9403"
    scale: 1.5
    shape: diamond

- type: entity
  parent: [ BaseStructureComputerTabletop, ComputerGunneryConsole ]
  id: ComputerTabletopGunneryConsole
  components:
  - type: Sprite
    drawdepth: SmallObjects
    layers:
    - map: [ "computerLayerBody" ]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: computer_tabletop
    - map: [ "computerLayerKeyboard" ]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: generic_keyboard_tabletop
    - map: [ "computerLayerScreen" ]
      sprite: _Hex/Structures/Machines/computers.rsi
      state: gunnery_screen
    - map: [ "computerLayerKeys" ]
      sprite: _Hex/Structures/Machines/computers.rsi
      state: gunnery_keys
