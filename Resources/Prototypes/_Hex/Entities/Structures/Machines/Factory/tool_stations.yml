- type: entity
  id: FactoryToolStationBase
  abstract: true
  parent: BaseMachinePowered
  placement:
    mode: SnapgridCenter
  components:
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Transform
    noRot: false
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: Sprite
    sprite: _NF/Structures/Machines/assembler.rsi
    snapCardinals: true
    layers:
    - state: assembler
      map: ["enum.FactoryToolStationVisualLayers.Base"]
    - state: assembler-on-unlit
      shader: unshaded
      map: ["enum.FactoryToolStationVisualLayers.Screen"]
    - state: assembler-running-unlit
      shader: unshaded
      visible: false
      map: ["enum.FactoryToolStationVisualLayers.Working"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FactoryToolStationVisuals.Powered:
        enum.FactoryToolStationVisualLayers.Screen:
          True: { visible: true }
          False: { visible: false }
      enum.FactoryToolStationVisuals.Working:
        enum.FactoryToolStationVisualLayers.Working:
          True: { visible: true }
          False: { visible: false }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: FactoryToolStationWelder
  parent: FactoryToolStationBase
  name: factory welder station
  description: An automated stationary manipulator station that performs precision welding operations on items passing in front of it.
  components:
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: FactoryToolStation
    toolQuality: Welding
    internalTool: Welder
    workSound:
      path: /Audio/Items/welder.ogg
    operationTime: 1.5

