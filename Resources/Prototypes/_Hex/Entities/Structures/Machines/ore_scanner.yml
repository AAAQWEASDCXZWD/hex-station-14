- type: entity
  id: HexShuttleOreScanner
  parent: BaseMachinePowered
  name: shuttle ore scanner
  description: An advanced sub-space radar system that scans nearby asteroids for ore deposits and transmits the data to shuttle flight consoles.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _NF/Structures/Specific/Explorers/salvageradar.rsi
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
  - type: ShuttleOreScanner
    range: 300
  - type: Machine
    board: HexShuttleOreScannerCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -10
    range: 4
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: StaticPrice
    price: 350
