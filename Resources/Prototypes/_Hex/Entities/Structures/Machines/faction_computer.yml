- type: entity
  parent: BaseComputerAiAccess
  id: FactionComputer
  name: faction terminal
  description: A terminal for registering a faction and managing its profile.
  components:
  - type: FactionComputer
  # Own copy of the generic computer sprite so the terminal has a stable sprite
  # even if the parent prototype's sprite changes or fails to load.
  - type: Sprite
    sprite: _Hex/Structures/Machines/faction_computer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ItemSlots
    slots:
      FactionComputer-id:
        name: faction-computer-id-slot-name
        insertSound: /Audio/Machines/id_insert.ogg
        ejectSound: /Audio/Machines/id_swipe.ogg
        whitelist:
          components:
          - IdCard
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      FactionComputer-id: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.FactionComputerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FactionComputerUiKey.Key:
        type: FactionComputerBoundUserInterface
