# -----------------------------------------------------------------------------
# 5. ПЛАТО (ФОЛБЕК — ВСЕ, ЩО НЕ ОКО І НЕ ПОЯС)
# Усіяна дрібними астероїдами пустка:
# Малий корабель пролітає хоч по прямій (зазори ~15-20м),
# а великий шатл (15-20м габариту) вже мусить постійно маневрувати.
# Тільки Small і Medium, без гігантських брил!
# -----------------------------------------------------------------------------
- type: spaceBiome
  id: HexPupilPlateau
  parent: HexPupilBiomeBase
  priority: 0
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: HexDensityPlateau
    randomCancelChance: 0.05
    safetyZoneRadius: 6.0
  - type: SimpleDebrisSelector
    debrisTable:
    # Small ("пісок" і дрібниця):
    - id: NFAsteroidDebrisSmall
      prob: 2.0
      orGroup: debris
    - id: NFAsteroidScrapDebrisSmall
      prob: 1.8
      orGroup: debris
    # Medium (основні орієнтири):
    - id: NFAsteroidDebrisMedium
      prob: 2.2
      orGroup: debris
    - id: NFAsteroidScrapDebrisMedium
      prob: 1.8
      orGroup: debris
    - id: NFAsteroidAndesiteDebrisMedium
      prob: 1.5
      orGroup: debris
    - id: NFAsteroidBasaltDebrisMedium
      prob: 1.5
      orGroup: debris
    - id: NFAsteroidChromiteDebrisMedium
      prob: 1.5
      orGroup: debris
    - id: NFAsteroidRockDebrisMedium
      prob: 1.5
      orGroup: debris
    # Трохи Large як рідкісні перешкоди:
    - id: NFAsteroidDebrisLarge
      prob: 0.5
      orGroup: debris
    - id: NFAsteroidScrapDebrisLarge
      prob: 0.4
      orGroup: debris
  - type: NoiseDrivenDebrisSelector
    debrisTable:
    - id: NFWreckDebrisSmall
      prob: 0.8
      orGroup: wreck
    - id: NFWreckDebrisMedium
      prob: 0.2
      orGroup: wreck
