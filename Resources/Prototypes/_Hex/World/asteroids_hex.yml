# =============================================================================
# АСТЕРОЇДИ HEX-STATION
# 1. Пустишки (Empty): 100% твердий камінь, 0% руди, 0% мобів. Барикади та маса.
# 2. Багаті рудоносні Тип 1 (RichAll): ~80% різноманітної руди, ~15% каменю, ~5% мобів.
# 3. Багаті рудоносні Тип 2 (RichSingle): ~75% моно-руди, ~18% каменю, ~5% вкраплень, ~2% мобів.
# =============================================================================

# region Base Templates
- type: entity
  id: HexBaseAsteroidRockEmpty
  parent: NFBaseDebris
  abstract: true
  components:
  - type: BlobFloorPlanBuilder
    floorTileset:
