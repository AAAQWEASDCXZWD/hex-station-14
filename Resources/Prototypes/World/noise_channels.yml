# -----------------------------------------------------------------------------
# Спеціалізовані канали щільності для гексагональної системи HexPupil:
# -----------------------------------------------------------------------------

# 1. Плато: дистанція між астероїдами ~14..22 метри.
# Дрібний корабель пролітає легко, а великий шатл (шириною 15-20м) мусить маневрувати.
- type: noiseChannel
  id: HexDensityPlateau
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 2
  outputMultiplier: 8.0
  minimum: 14.0

# 2. Пояс: дистанція ~8..14 метрів.
# Густий щільний бар'єр з великих астероїдів.
- type: noiseChannel
  id: HexDensityBelt
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 2
  outputMultiplier: 6.0
  minimum: 8.0

# 3. Око: дистанція ~9..16 метрів.
# Неприємне місце з купою великих астероїдів та дрібними між ними.
- type: noiseChannel
  id: HexDensityEye
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 2
  outputMultiplier: 7.0
  minimum: 9.0

# 4. Буферні / розміжні зони: середня дистанція ~12..18 метрів.
- type: noiseChannel
  id: HexDensityBuffer
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 2
  outputMultiplier: 6.0
  minimum: 12.0
